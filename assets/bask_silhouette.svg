<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="Bask">
  <!-- The mark as a single shape, for the slots Android fills with one flat
       colour: the themed launcher icon and the status bar notification.
       Both throw the colours away and keep the alpha, so the play mark is
       knocked out of the disc rather than painted on top of it — otherwise
       the silhouette is a featureless circle. The rim is inside the disc's
       outline here for the same reason: a 2 unit ring of the same colour as
       the fill it surrounds is invisible once everything is one colour. -->
  <path fill-rule="evenodd" fill="#FFFFFF"
        d="M21 54 A33 33 0 1 0 87 54 A33 33 0 1 0 21 54 Z M45 37 L45 71 L73 54 Z"/>
</svg>
