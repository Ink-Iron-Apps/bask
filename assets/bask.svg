<svg xmlns="http://www.w3.org/2000/svg" viewBox="19 19 70 70" role="img" aria-label="Bask">
  <!-- The Bask mark. One geometry, shared by every size the app ships:
       a deep teal disc, a paper rim, and a bright teal play mark.
       Drawn in a 108 unit square centred on (54, 54) with an outer radius
       of 33, which is exactly Android's adaptive icon safe zone, so the
       same coordinates work cropped (here), padded (the adaptive
       foreground) and on a backplate (the launcher rasters). -->
  <circle cx="54" cy="54" r="32" fill="#095F73" stroke="#E8E4DA" stroke-width="2"/>
  <path d="M45 37 L45 71 L73 54 Z" fill="#3BB3C9"/>
</svg>
