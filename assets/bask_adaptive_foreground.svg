<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="Bask">
  <!-- The mark on the full 108 unit adaptive canvas, where only the centre
       66 units survive every launcher mask. The mark's outer radius of 33
       fills that circle exactly and nothing of it can be cropped away.
       Doubles as the startup logo, which is why it carries no backplate. -->
  <circle cx="54" cy="54" r="32" fill="#095F73" stroke="#E8E4DA" stroke-width="2"/>
  <path d="M45 37 L45 71 L73 54 Z" fill="#3BB3C9"/>
</svg>
