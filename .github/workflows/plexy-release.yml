name: Plexy release

# Builds signed APKs and publishes them as a GitHub Release.
#
# Signing uses the same keystore as local builds. That matters for a sideloaded
# app: Android refuses to update an install whose signature changed, so a
# CI-built APK signed with a different key could only be installed by
# uninstalling first, which takes the download database and downloaded media
# with it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to v<pubspec version>-<run number>)"
        required: false
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.0"
  # Pinned by android/app/build.gradle.kts; the runner image ships neither.
  ANDROID_NDK_VERSION: "29.0.14206865"
  ANDROID_CMAKE_VERSION: "4.1.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned NDK and CMake
        # sdkmanager is not on PATH on the runner image.
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n1)
          echo "using $sdkmanager"
          yes | "$sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        # Two known-bad tests are excluded rather than silenced: the backdrop test
        # fails the same way on unmodified upstream, and the LAN discovery test is
        # a flaky UDP loopback timing check.
        run: |
          flutter test \
            --exclude-tags none \
            $(find test -name '*_test.dart' \
              ! -name 'cycling_media_backdrop_test.dart' \
              ! -name 'jellyfin_lan_discovery_service_test.dart' | tr '\n' ' ')

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Without it the APK is unsigned and cannot be installed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/plexy-release.jks
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=plexy-release.jks
          EOF

      - name: Build APKs
        # The read token is baked in so the installed app can poll the private
        # release mirror. It is scoped to that mirror only, never to source.
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=UPDATE_READ_TOKEN=${{ secrets.UPDATE_READ_TOKEN }}

      - name: Remove signing material
        if: always()
        run: rm -f android/app/plexy-release.jks android/key.properties

      - name: Name the release
        id: meta
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="v${version}-${{ github.run_number }}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            [ -f "app-$abi-release.apk" ] && mv "app-$abi-release.apk" "Plexy-${tag}-${abi}.apk"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Plexy ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/Plexy-*.apk
          body: |
            Personal build of Plexy ${{ steps.meta.outputs.version }} (commit ${{ github.sha }}).

            Install `arm64-v8a` on any modern phone. Signed with the same key as
            previous builds, so it updates in place.

      - name: Mirror APKs for the in-app updater
        # The installed app polls this mirror, which holds artifacts only, so the
        # token it carries can never reach source or history.
        env:
          GH_TOKEN: ${{ secrets.RELEASES_WRITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASES_WRITE_TOKEN is not set — skipping mirror. The in-app updater will not see this release."
            exit 0
          fi
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo LightWraith8268/plexy-releases \
            --title "Plexy ${{ steps.meta.outputs.tag }}" \
            --notes "Artifacts for ${{ steps.meta.outputs.tag }} (source commit ${{ github.sha }})." \
            build/app/outputs/flutter-apk/Plexy-*.apk
