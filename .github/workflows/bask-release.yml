name: Bask release

# Builds signed APKs and publishes them as a GitHub Release.
#
# Signing uses the same keystore as local builds. That matters for a sideloaded
# app: Android refuses to update an install whose signature changed, so a
# CI-built APK signed with a different key could only be installed by
# uninstalling first, which takes the download database and downloaded media
# with it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to v<pubspec version>-<run number>)"
        required: false
        type: string

# Every step is written in bash. A Windows runner would otherwise get
# PowerShell and fail on the first pipeline, so pin the shell rather than write
# each step twice.
defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  # Two releases in flight would bump the version from the same starting point
  # and fight over the tag, so a later run waits rather than overlapping.
  group: bask-release
  cancel-in-progress: false

env:
  # 3.47.1 because the Windows build needs the patched engine below, which is
  # built from 3.47.1's engine revision and refuses to install into any other
  # SDK. The Android build is indifferent; upstream ships both from 3.47.1.
  FLUTTER_VERSION: "3.47.1"
  # Pinned by android/app/build.gradle.kts; the runner image ships neither.
  ANDROID_NDK_VERSION: "29.0.14206865"
  ANDROID_CMAKE_VERSION: "4.1.2"

jobs:
  build:
    runs-on: ${{ vars.SELF_HOSTED_RUNNER || 'ubuntu-latest' }}
    outputs:
      # What the Windows job needs to reproduce this build's tree and name its
      # artifact the same way.
      tag: ${{ inputs.tag || steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the version bump reads tags and the commits since the
          # last one. Credentials persist so the bump can be pushed back.
          fetch-depth: 0

      - name: Free runner disk space
        # Only on GitHub's disposable machines. On a self-hosted runner this
        # deletes the real NDK and prunes every Docker image on the box.
        if: ${{ !vars.SELF_HOSTED_RUNNER }}
        # The runner ships ~25 GB of toolchains this build never touches, and the
        # pinned NDK, the restored Gradle cache and the build outputs together
        # overflow what is left. That surfaced at the very end of the job as tar
        # failing to write the cache archive ("Wrote only 2048 of 10240 bytes"),
        # so every run started from a cold Gradle cache. The preinstalled NDKs go
        # too — the pinned one is installed below.
        run: |
          df -h /
          sudo rm -rf             /usr/share/dotnet             /usr/share/swift             /usr/local/lib/node_modules             /usr/local/share/powershell             /usr/local/.ghcup             /opt/ghc             /opt/hostedtoolcache/CodeQL             "$ANDROID_HOME/ndk"
          docker image prune --all --force || true
          df -h /

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # Uploading to GitHub's cache service is a net loss on a self-hosted
          # runner: the SDK already persists on local disk between runs.
          cache: ${{ !vars.SELF_HOSTED_RUNNER }}

      - name: Install pinned NDK and CMake
        # sdkmanager is not on PATH on the runner image.
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ]; then
            echo "::error::Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set"
            exit 1
          fi

          # A machine that develops this app already has them, and sdkmanager on
          # Windows wants a console it does not get here.
          if [ -d "$sdk/ndk/$ANDROID_NDK_VERSION" ] && [ -d "$sdk/cmake/$ANDROID_CMAKE_VERSION" ]; then
            echo "NDK $ANDROID_NDK_VERSION and CMake $ANDROID_CMAKE_VERSION already installed"
            exit 0
          fi

          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager=$(find "$sdk" -name 'sdkmanager*' -type f | head -n1)
          echo "using $sdkmanager"
          # A finite stream of license answers rather than `yes |`. sdkmanager
          # stops reading stdin once it has what it needs, which kills `yes`
          # with SIGPIPE; every `run:` block here is `-o pipefail`, so that
          # failure sinks the step after the install has already succeeded
          # ("yes: standard output: Broken pipe"). Fifty lines fit inside the
          # pipe buffer, so printf never blocks and never sees a closed pipe.
          printf 'y\n%.0s' $(seq 1 50) | "$sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}" > /dev/null

      - name: Cache Gradle
        # Same reason as the Flutter cache above.
        if: ${{ !vars.SELF_HOSTED_RUNNER }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install dependencies
        run: flutter pub get

      # Everything below re-checks a tree the auto-merge already verified before
      # it let the merge happen: same commit content, same gates. That is worth
      # paying for as a second opinion when the runners are free, and is pure
      # duplication when there is one slow machine doing both. Setting
      # RELEASE_REVERIFY to false trusts the pre-merge gates instead.
      #
      # A release dispatched by hand against an unverified main is the case this
      # protects, so the default stays on.
      - name: Check formatting
        if: ${{ vars.RELEASE_REVERIFY != 'false' }}
        # dart format has no exclude flag, and generated sources are formatted by
        # whatever generated them, so format everything and then ask git whether
        # anything that is not generated actually moved.
        run: |
          dart format lib test > /dev/null
          git diff --exit-code -- ':!*.g.dart' ':!*.freezed.dart'
          git checkout -- .

      - name: Analyze
        if: ${{ vars.RELEASE_REVERIFY != 'false' }}
        run: flutter analyze

      - name: Check for unused files and code
        if: ${{ vars.RELEASE_REVERIFY != 'false' }}
        # dart_code_linter's analyzer plugin crashes on Linux, so its checks run
        # as explicit commands. --fatal-unused matters: without it the command
        # reports findings and still exits 0, which is a gate that never fails.
        run: |
          dart run dart_code_linter:metrics check-unused-files lib --fatal-unused
          dart run dart_code_linter:metrics check-unused-code lib --fatal-unused

      - name: Run tests
        if: ${{ vars.RELEASE_REVERIFY != 'false' }}
        # `flutter test` runs one worker per core by default. Every worker does
        # real disk I/O — atomic writes, fsync, temp files — so on a machine
        # whose storage is the bottleneck they starve each other: individual
        # tests pass the 30s timeout and the suite takes far longer than running
        # fewer at once would. TEST_CONCURRENCY caps it where that applies.
        # TEST_TIMEOUT scales the per-test limit. The default 30s assumes the
        # machine finishes a test in ordinary time; on slower hardware tests
        # that pass in under a second here cross it, which reads as 24 failures
        # that are really one slow disk.
        run: >-
          flutter test
          ${{ vars.TEST_CONCURRENCY && format('--concurrency={0}', vars.TEST_CONCURRENCY) || '' }}
          ${{ vars.TEST_TIMEOUT && format('--timeout={0}', vars.TEST_TIMEOUT) || '' }}

      - name: Bump version from conventional commits
        id: version
        # feat -> minor, fix/perf -> patch, ! or BREAKING CHANGE -> major. The build
        # number is the run number, which only ever climbs. The bump lands in
        # pubspec.yaml before the build so the APK reports the version it ships as,
        # which is what the in-app updater compares against.
        run: |
          # Bump from whichever is further ahead: the version pubspec records, or
          # the newest release that actually exists. They diverge when a run
          # publishes a release but cannot write the version back — main then
          # names a version older than the newest tag, and bumping from it would
          # land on a tag that is already taken and overwrite that release's
          # APKs. Tags are the record of what shipped, so they win ties.
          pubspec_version=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          last_tag=$(git tag --list 'v*' --sort=-creatordate | head -n1)
          tag_version=${last_tag#v}
          if [ -z "$tag_version" ]; then
            current="$pubspec_version"
          else
            current=$(printf '%s\n%s\n' "$pubspec_version" "$tag_version" | sort -V | tail -n1)
          fi
          if [ "$current" != "$pubspec_version" ]; then
            echo "::warning::pubspec records $pubspec_version but $last_tag is published; bumping from $current"
          fi
          if [ -z "$last_tag" ]; then
            range=""
          else
            range="${last_tag}..HEAD"
          fi
          subjects=$(git log --format='%s%n%b' $range)

          bump=none
          echo "$subjects" | grep -qiE '^(feat|fix|perf|refactor|chore)(\(.+\))?!:|^BREAKING CHANGE:' && bump=major
          if [ "$bump" = none ]; then echo "$subjects" | grep -qiE '^feat(\(.+\))?:' && bump=minor; fi
          if [ "$bump" = none ]; then echo "$subjects" | grep -qiE '^(fix|perf)(\(.+\))?:' && bump=patch; fi
          # Anything else still ships, as a patch: a release that reused its
          # predecessor's version would be invisible to the updater.
          if [ "$bump" = none ]; then bump=patch; fi

          major=$(echo "$current" | cut -d. -f1)
          minor=$(echo "$current" | cut -d. -f2)
          patch=$(echo "$current" | cut -d. -f3)
          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          next="${major}.${minor}.${patch}"

          # Last line of defence: never reuse a tag. The publish step treats an
          # existing tag as "already created" and then clobbers its assets, so a
          # collision would replace a shipped release's APKs with this build's.
          while git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; do
            patch=$((patch+1))
            next="${major}.${minor}.${patch}"
            echo "::warning::v${next%.*}.$((patch-1)) already exists; advancing to v${next}"
          done

          echo "$current -> $next ($bump)"

          sed -i "s/^version: .*/version: ${next}+${{ github.run_number }}/" pubspec.yaml
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Without it the APK is unsigned and cannot be installed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/bask-release.jks
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=bask-release.jks
          EOF

      - name: Build APKs
        # The read token is baked in so the installed app can poll this
        # repository's releases.
        run: |
          # arm64-v8a and armeabi-v7a. The CMake step below builds FFmpeg, libdovi
          # and mpv once per ABI, so each added ABI costs another full native
          # build; 32-bit is carried because Google TV sets ship a 32-bit
          # userspace (Sony Bravia on Android 12 reports armeabi-v7a only) and
          # selectApkAsset falls back to a universal APK that is not published,
          # so an unpublished ABI cannot install or update at all. x86 stays out:
          # no device here runs it.
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-arm \
            --dart-define=UPDATE_RELEASES_REPO=https://api.github.com/repos/${{ github.repository }}

      - name: Remove signing material
        if: always()
        run: rm -f android/app/bask-release.jks android/key.properties

      - name: Name the APKs
        env:
          TAG: ${{ inputs.tag || steps.version.outputs.tag }}
        run: |
          cd build/app/outputs/flutter-apk
          # `if` rather than `[ -f ] && mv`: the build no longer emits every ABI,
          # and a false test on the last iteration would make the loop -- and so
          # the step, under set -e -- exit non-zero.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "app-$abi-release.apk" ]; then
              mv "app-$abi-release.apk" "Bask-${TAG}-${abi}.apk"
            fi
          done

      - name: Publish release
        # gh with a real backoff rather than an action that gives up after three
        # rapid retries: GitHub answers "No server is currently available" often
        # enough to lose a finished 20-minute build over it. Creating the release
        # and attaching assets are separate calls, so each is retried on its own
        # and a run that got partway through resumes instead of starting over.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="Personal build of Bask ${VERSION} (commit ${GITHUB_SHA}).

          Install \`arm64-v8a\` on any modern phone. Install \`armeabi-v7a\` on a
          32-bit Android TV set, such as a Sony Bravia on Android 12. Signed with
          the same key as previous builds, so it updates in place."

          attempt=0
          until gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            attempt=$((attempt+1))
            if [ "$attempt" -gt 5 ]; then echo "::error::Could not create release $TAG"; exit 1; fi
            echo "Creating release $TAG (attempt $attempt)"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Bask $TAG" --notes "$notes" || sleep $((attempt*15))
          done

          attempt=0
          # The Windows zip is optional: its build step is allowed to fail
          # without taking the Android release with it.
          until gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber build/app/outputs/flutter-apk/Bask-*.apk; do
            attempt=$((attempt+1))
            if [ "$attempt" -gt 5 ]; then echo "::error::Could not attach APKs to $TAG"; exit 1; fi
            echo "Retrying asset upload (attempt $attempt)"
            sleep $((attempt*15))
          done

          # A release with no APK is worse than a failed run: the updater would
          # offer an update it cannot install.
          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          echo "$TAG published with $count asset(s)"
          [ "$count" -gt 0 ] || { echo "::error::Release $TAG has no assets"; exit 1; }

      - name: Record the bumped version
        # Only after the release exists and carries its APKs. Committing earlier
        # left main claiming a version no release had, so the next run bumped from
        # a version that was never published. [skip ci] keeps this commit from
        # triggering a release of itself.
        #
        # The commit is rebuilt on whatever main currently points at, rather than
        # on the commit this build started from. A build takes ~30 minutes, and a
        # merge landing in that window used to reject this push and fail the run
        # after the release had already published — leaving main claiming an
        # older version than the newest release.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main

            # Never walk a concurrent release's version backwards: if main already
            # records this version or a later one, there is nothing to record.
            current=$(git show origin/main:pubspec.yaml | grep '^version:' | sed 's/version: *//' | cut -d'+' -f1)
            highest=$(printf '%s\n%s\n' "$VERSION" "$current" | sort -V | tail -n1)
            if [ "$current" = "$VERSION" ] || { [ "$highest" = "$current" ] && [ "$current" != "$VERSION" ]; }; then
              echo "main already records $current; nothing to do"
              exit 0
            fi

            # Rebuild the one-line change on top of current main. The build tree is
            # finished with by now, so moving it is safe — and starting from main
            # keeps this commit from reverting anything that landed meanwhile.
            #
            # Forced because the bump step edited pubspec.yaml in place to build
            # the APKs, and an ordinary checkout refuses to overwrite that. The
            # edit is re-applied on the next line, so discarding it loses nothing.
            git checkout -f -B record-version origin/main
            sed -i "s/^version: .*/version: ${VERSION}+${{ github.run_number }}/" pubspec.yaml
            git add pubspec.yaml
            git commit -m "chore(release): ${TAG} [skip ci]" || exit 0

            if git push origin HEAD:main; then
              echo "recorded $VERSION on main"
              exit 0
            fi
            echo "main moved while pushing; retrying ($attempt)"
            sleep $((attempt * 5))
          done

          echo "::error::Could not record $VERSION on main"
          exit 1

  windows:
    # GitHub's own Windows runners build this; it needs no self-hosted machine.
    # Separate from the Android job because a single job has a single OS, and
    # the Android build is the one that must not wait on a Windows toolchain.
    #
    # Beside the Android job rather than before it: the APKs are the release,
    # and a Windows toolchain failure must not hold them back or withdraw them.
    needs: build
    if: ${{ needs.build.outputs.tag != '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit the APKs were built from. The release tag points here
          # too, but the version bump is written back to main afterwards, so
          # the tag is not a reliable way to get this tree.
          ref: ${{ github.sha }}

      - name: Stamp the release version
        # The same line the Android job's version step applies to its own
        # checkout, so the Windows build reports the version being released
        # rather than the one main still records.
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: ${VERSION}+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install the patched Windows engine
        # Bask cannot composite on a stock engine. The video is a child HWND
        # inside the Flutter view; what puts the UI above it is the patched
        # engine presenting the UI on a topmost DirectComposition visual when
        # FLUTTER_WINDOWS_DCOMP is set (windows/runner/main.cpp). On a stock
        # engine that flag does nothing, the video window covers everything,
        # and the player's controls are present and clickable but invisible —
        # which is exactly what v2.33.0 and earlier shipped.
        #
        # The script asserts the SDK's engine.stamp matches the artifacts, so a
        # Flutter bump that moves the revision fails here rather than producing
        # another build with no visible controls.
        id: windows_engine
        run: |
          flutter precache --windows
          powershell -NoProfile -ExecutionPolicy Bypass -File windows/tool/install-patched-engine.ps1
          # Hash of the engine the build will link against, so the bundle can
          # be checked for carrying this engine rather than a stock one.
          sdk=$(dirname "$(dirname "$(command -v flutter)")")
          dll="$sdk/bin/cache/artifacts/engine/windows-x64-release/flutter_windows.dll"
          [ -f "$dll" ] || { echo "::error::No engine DLL at $dll"; exit 1; }
          echo "engine_sha=$(sha256sum "$dll" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: Build the portable Windows app
        run: |
          flutter build windows --release \
            --dart-define=UPDATE_RELEASES_REPO=https://api.github.com/repos/${{ github.repository }}

      - name: Verify the Windows bundle
        # The checks a file listing cannot make: that the engine in the bundle
        # is the patched one this build installed, and that the app actually
        # starts. Four releases shipped a player with invisible controls while
        # analyze, 3,500 tests and a file check all passed, because nothing
        # ever ran the thing.
        #
        # On failure the bundle is deleted as well as the job failed: the
        # upload step below attaches whatever zip exists, so removing it is
        # what keeps a bad build unpublished. The APKs are already out by now
        # and are not withdrawn.
        run: |
          bundle=build/windows/x64/runner/Release
          if ! powershell -NoProfile -ExecutionPolicy Bypass -File windows/tool/verify-bundle.ps1 \
            -BundleDir "$bundle" -ExpectedEngineSha "${{ steps.windows_engine.outputs.engine_sha }}"; then
            echo "::warning::Windows bundle failed verification; it will not be published"
            rm -rf "$bundle"
            exit 1
          fi

      - name: Package the portable Windows app
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          bundle=build/windows/x64/runner/Release
          [ -d "$bundle" ] || { echo "::warning::No Windows bundle to package"; exit 0; }
          # The marker is what makes it portable: with it beside the exe the
          # app keeps its database, preferences, caches and downloads in
          # ./data instead of %APPDATA%, so the folder is the whole install.
          printf '%s\n' \
            'Delete this file to make this copy store its data in %APPDATA% instead.' \
            'While it exists, everything Bask writes stays in the bask-data folder next to the executable.' \
            > "$bundle/portable.txt"
          rm -rf build/windows-portable && mkdir -p build/windows-portable
          cp -r "$bundle" "build/windows-portable/Bask-${TAG}-windows-x64"
          (cd build/windows-portable && 7z a -tzip "Bask-${TAG}-windows-x64-portable.zip" "Bask-${TAG}-windows-x64" >/dev/null)
          ls -la build/windows-portable/*.zip

      - name: Attach the portable Windows app to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          zip=$(ls build/windows-portable/*.zip 2>/dev/null || true)
          [ -n "$zip" ] || { echo "::error::No Windows zip to attach to $TAG"; exit 1; }
          attempt=0
          until gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $zip; do
            attempt=$((attempt+1))
            if [ "$attempt" -gt 5 ]; then echo "::error::Could not attach the Windows build to $TAG"; exit 1; fi
            sleep $((attempt*10))
          done
          echo "attached $(basename "$zip") to $TAG"
