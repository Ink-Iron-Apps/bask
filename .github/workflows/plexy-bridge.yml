name: Plexy bridge release

# Builds the last Plexy APK: v2.50.0 plus the half of the handoff provider
# that serves downloaded media, and nothing else.
#
# Why this exists at all. The handoff provider has to live in the app that
# holds the files, and Plexy 2.50.0 — the last Plexy anyone has installed —
# shipped a provider that answers only `readSettingsExport`. Bask asks it for a
# download manifest, gets null, and concludes there is nothing to bring across.
# So the download handoff cannot work until Plexy itself can serve, and Plexy's
# main line ended at the rename.
#
# It builds from the `plexy-bridge` branch, which is v2.50.0 with one commit on
# top, so the APK differs from the one people are running by that commit alone.
# Signed with the same key, so it updates Plexy in place and the downloads it
# exists to hand over stay where they are.
#
# Dispatch only. This is not a line of development; it is one build, and it is
# published here rather than to the Bask repository because Plexy installs poll
# this one and Bask installs do not.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: false
        default: plexy-bridge
        type: string
      tag:
        description: "Release tag"
        required: false
        default: v2.50.1
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: plexy-bridge
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.1"
  ANDROID_NDK_VERSION: "29.0.14206865"
  ANDROID_CMAKE_VERSION: "4.1.2"

jobs:
  build:
    runs-on: ${{ vars.SELF_HOSTED_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Free runner disk space
        if: ${{ !vars.SELF_HOSTED_RUNNER }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/node_modules \
            /usr/local/share/powershell /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL "$ANDROID_HOME/ndk"
          docker image prune --all --force || true
          df -h /

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ !vars.SELF_HOSTED_RUNNER }}

      - name: Install pinned NDK and CMake
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ]; then
            echo "::error::Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set"
            exit 1
          fi
          if [ -d "$sdk/ndk/$ANDROID_NDK_VERSION" ] && [ -d "$sdk/cmake/$ANDROID_CMAKE_VERSION" ]; then
            echo "NDK $ANDROID_NDK_VERSION and CMake $ANDROID_CMAKE_VERSION already installed"
            exit 0
          fi
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager=$(find "$sdk" -name 'sdkmanager*' -type f | head -n1)
          yes | "$sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}" > /dev/null

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # The one gate worth keeping. This branch is not the line anyone
        # develops on, so the full suite proves nothing new about it, but a
        # build that cannot compile should fail before it burns the native
        # build.
        run: flutter analyze --no-pub

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. An APK signed with any other key cannot update the Plexy already installed, which is the only thing this build is for."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/plexy-release.jks
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=plexy-release.jks
          EOF

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-arm \
            --dart-define=UPDATE_READ_TOKEN=${{ secrets.UPDATE_READ_TOKEN }} \
            --dart-define=UPDATE_RELEASES_REPO=https://api.github.com/repos/${{ github.repository }}

      - name: Remove signing material
        if: always()
        run: rm -f android/app/plexy-release.jks android/key.properties

      - name: Name the APKs
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a; do
            if [ -f "app-$abi-release.apk" ]; then
              mv "app-$abi-release.apk" "Plexy-${TAG}-${abi}.apk"
            fi
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          notes="Plexy ${TAG} (commit ${GITHUB_SHA}).

          The last Plexy build. It is v2.50.0 with one change: the handoff
          provider can now serve this install's downloaded media to Bask, which
          it could not before, so Bask's \"Bring downloads from the old app\"
          has something to read.

          Install it over your existing Plexy — same signing key, so it updates
          in place and your downloads stay exactly where they are. Then open
          Bask and use Settings to bring them across. Nothing is moved or
          deleted on this side, so Plexy keeps working either way and you can
          remove it once you are happy.

          Install \`arm64-v8a\` on a phone or tablet, \`armeabi-v7a\` on a
          32-bit Android TV set."

          attempt=0
          until gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            attempt=$((attempt+1))
            if [ "$attempt" -gt 5 ]; then echo "::error::Could not create release $TAG"; exit 1; fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Plexy $TAG" --notes "$notes" || sleep $((attempt*15))
          done

          attempt=0
          until gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber build/app/outputs/flutter-apk/Plexy-*.apk; do
            attempt=$((attempt+1))
            if [ "$attempt" -gt 5 ]; then echo "::error::Could not attach APKs to $TAG"; exit 1; fi
            sleep $((attempt*15))
          done

          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          [ "$count" -gt 0 ] || { echo "::error::Release $TAG has no assets"; exit 1; }
          echo "$TAG published with $count asset(s)"
